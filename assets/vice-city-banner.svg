<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Vice City night drive</title>
<desc id="desc">A retro Miami skyline, palm trees, striped sunset, neon ocean and perspective road in pink, violet and cyan.</desc>
